[package]
name = "turborm-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Independent reMarkable Cloud library and CLI for browsing, native downloads and original-file export"
license = "GPL-3.0-or-later"
repository = "https://github.com/KihonNeko/TurboRM"

[[bin]]
name = "turborm-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lopdf = { version = "0.38", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
roxmltree = "0.20"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Use freedesktop.org Secret Service (for example GNOME Keyring or KWallet).
# zbus avoids a system libdbus development dependency, while crypto-rust keeps
# the Secret Service session encrypted. Selecting this explicit backend also
# prevents the unsupported-platform mock store from becoming the default.
keyring = { version = "3.6.3", features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
